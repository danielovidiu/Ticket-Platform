<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Supersanity — Bucharest music &amp; performance collective. Events, tickets, artists." />
        <!-- No font is fetched here. The three the site actually renders with are
             self-hosted in src/index.css; this used to also pull Inter 600 from Google
             on every page load, which nothing on the page has ever rendered with — its
             only appearance in the codebase is as one name in the CMS font picker's
             suggestion list, which loads its own preview on demand. The two preconnect
             hints went with it: they opened a TLS connection to Google for every public
             visitor, to speed up an admin-only path. -->
        <title>Supersanity | Artist Collective</title>
        <!-- The CMS theme, as a render-blocking stylesheet.
             This is what stops the palette flashing. The theme used to arrive only as
             JSON, fetched after the app mounted and applied as inline custom properties —
             two round trips behind the first paint, so every reload showed the defaults
             from index.css and then snapped to the real colours. A stylesheet in <head>
             is render-blocking by definition, so the browser has the theme before it
             paints anything. Served from the backend (/api/* is same-origin in the
             deployed rewrite, and proxied in dev by vite.config.mjs). -->
        <link rel="stylesheet" href="/api/cms/theme.css" />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!-- No third-party analytics load here. Any future analytics must be gated
             behind the CookieConsent component (opt-in) rather than firing on load. -->
        <!-- Vite reads this file from the project root as the entry point: a real
             document it transforms, not a template it copies, which is why the module
             script is written out here rather than injected by the build. CRA's
             %PUBLIC_URL% placeholders went with the move — they have no Vite equivalent,
             and every tag that referenced them had already gone. -->
        <script type="module" src="/src/index.jsx"></script>
    </body>
</html>
