# Dependency monitoring.
#
# The reason this exists: a manual `yarn audit` found dompurify sitting on a published
# XSS bypass, and dompurify is the only thing standing between CMS-authored HTML and the
# single `dangerouslySetInnerHTML` in the app. Nothing was watching for that, and
# typosquats and hijacked-maintainer releases are caught by noticing quickly or not at all.
#
# `security-updates-only` on the npm side is deliberate. react-scripts (CRA) is
# unmaintained and pins a large, permanently-outdated transitive tree, so an open-ended
# version bump would raise a PR a day that nobody merges — which trains everyone to ignore
# the ones that matter. Security advisories are the signal worth interrupting for.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Grouped so a security bump and its transitive peers arrive as one reviewable PR.
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # Not security-only, unlike npm above. That restriction exists because CRA's
  # 1581-package tree would raise a PR a day and train everyone to ignore them; the
  # backend is 40 packages and quiet, so routine bumps are reviewable — and leaving them
  # unraised is how a lockfile silently drifts from what `pip-compile` produces. One
  # grouped PR a week, minor and patch together, majors on their own so they get read.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
