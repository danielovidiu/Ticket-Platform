# Dependency monitoring.
#
# The reason this exists: a manual `yarn audit` found dompurify sitting on a published
# XSS bypass, and dompurify is the only thing standing between CMS-authored HTML and the
# single `dangerouslySetInnerHTML` in the app. Nothing was watching for that, and
# typosquats and hijacked-maintainer releases are caught by noticing quickly or not at all.
#
# Security-updates-only on the npm side is deliberate: an open-ended version bump on a
# tree this size raises PRs nobody merges, which trains everyone to ignore the ones that
# matter. Security advisories are the signal worth interrupting for.
#
# `open-pull-requests-limit: 0` is how that is said. It is a switch, not a cap: zero
# disables *version* updates outright and leaves security updates flowing, which is the
# only way Dependabot offers to express "advisories only". This read 10 for a while,
# while the comment above claimed the opposite — ten routine bumps duly arrived and sat
# there unmerged, which is the outcome the comment had predicted. The `groups` block
# below restricts nothing either: `applies-to: security-updates` only decides how
# security updates are bundled once they already qualify.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Grouped so a security bump and its transitive peers arrive as one reviewable PR.
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # Not security-only, unlike npm above. That restriction exists because CRA's
  # 1581-package tree would raise a PR a day and train everyone to ignore them; the
  # backend is 40 packages and quiet, so routine bumps are reviewable — and leaving them
  # unraised is how a lockfile silently drifts from what `pip-compile` produces. One
  # grouped PR a week, minor and patch together, majors on their own so they get read.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
