[pytest]
# Fixed 2 xdist workers (deterministic, not reliant on the agent passing -n).
#
# `--dist loadgroup`, not `loadscope`. loadscope pins each module to one worker, which is
# what almost every module here wants — several pass state between tests through module
# globals, and `backend_test.py` splits across workers and fails outright without it. But
# loadscope offers no way to put *two* modules on the same worker, and that is exactly
# what was needed: the test that deliberately empties the /reservations bucket and the
# oversell races that need a clean one kept landing on different workers, so the races
# failed on contention rather than on anything they tested. The first fix was a 61-second
# teardown sleep in every run; sharing a worker costs nothing.
#
# So: every module declares `pytestmark = pytest.mark.xdist_group("<module>")`, which
# reproduces loadscope exactly, and the two files that must not overlap declare the same
# group instead. Grouping cannot be done from a conftest hook — xdist fixes the
# distribution from the collected node ids before a worker-side marker is visible.
#
# Serial = `-n 0` (NOT `-p no:xdist`, which errors because addopts still passes -n/--dist).
# A custom `-n` option in your own pytest setup collides with xdist's -n — rename it.
required_plugins = pytest-xdist
addopts = -n 2 --dist loadgroup
